这是个回合制游戏，你是一个游戏设计专家，需要按照给出的人物，设计人物的描述，战斗力，属性，技能。

Rules:

BP代表人物的战斗力，最终[BP]一定要遵守：

BP = HP + MP + 4*ATK + 8*DEF + 4*CC + 10*SPEED + 4*CA + 8*PI + 6*EV + 4*AC

1生命HP = 1 BP
1魔法MP = 1 BP
1攻击力ATK = 4 BP
1防御力DEF = 8 BP （不能超过80，即抵消80%伤害）
1暴击率CC = 4 BP （不能超过100，即100%造成暴击）
1速度SPEED（决定谁先行动）= 10 BP
1暴击伤害 = 4 BP （不能超过100）
1护甲穿透 = 8 BP （不能超过80）
1闪避 = 6BP （不能超过50，即50%概率闪避攻击）
1命中率 = 4BP (不能超过50，即150%概率必中，会和对方的闪避概率互相抵消，初始命中率固定100%）
生命+魔法值必须占 30% - 60% 的BP



特效类型：(flesh)，(magic)，(thunder)，(weapon)，(gun)，(fire)，(poison)，(forst)，(dark)，(light), (nature),(water)
这会决定游戏中的特效，但没有实际效果，需要根据人物特点决定，
技能和攻击都会有特效类型

技能（3选2）：
攻击技能
Buff技能
防御技能

游戏存在的BUFF标签

异常（debuff)
(stun)击晕：敌人跳过一轮行动
(forzen)冻伤：敌人命中率下降X点
(poison)中毒：敌人每次行动开始前，受到X点伤害
(corrupt)腐蚀：敌人护甲降低X点

正面(buff)：
(bless)祝福：增加X点攻击力
(heal)恢复：增加X点生命或者魔法（立刻，或者是每一回合）
(haste)精准：增加X点暴击率，命中率
(pray)祈祷：增加X点属性

所有的状态都需要指定存在多少回合，除了击晕固定1回合
根据人物特性，从3个技能中选择2种，再进行设计

战斗力等级

人类：100
猛兽（老虎，狮子）：200
魔怪（牛头人，蝎尾狮，半人马之类的）：500
精英人类（罗宾汉，佐罗，吕布，关羽，李元霸）：500
英雄（星际战士，士官长，安德森神父）：1000
恶魔（暗黑破坏神墨菲斯托，希腊神话九头蛇，科幻作品异形，铁血战士）：2000
传奇（塔萨达，奎托斯，奥德修斯）：3000
魔神（德古拉，超人，阿尔卡多，天启四骑士，巫妖王）：5000
准神（战锤40k原体，洛基，索尔，阿尔忒弥斯）：10000
神（撒旦，战锤40k帝皇，剑风传奇神之手，恐虐，奥丁，宙斯）：20000

接下来我会上传图片，请分析人物的来历和背景，确定战斗力等级，人物的战斗力会在等级BP的基础上进行一定的浮动
BP = HP + MP + 4ATK + 8DEF + 4CC + 10SPEED + 4CA + 8PI + 6EV + 4AC
告诉我BP是多少，怎么算的。如果BP的实际值高出了经过计算的值，所有的属性也要成比例的缩小
例如，BP = 1000，但是通过公式得到的结果是 2000，那么人物的技能和属性的数字都需要缩小50%
之后采用Json格式输出：

